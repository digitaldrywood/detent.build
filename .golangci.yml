version: "2"
run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
  exclusions:
    # templ output can report generator-owned SA4006 and QF1002 findings.
    paths:
      - '_templ\.go$'

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
