# Release evidence only. Landing continues to use the runner's local gate.
name: CI

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

# Manual and hourly runs share the release lock; never cancel a deployment.
concurrency:
  group: develop-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  snapshot:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.snapshot.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: develop
          persist-credentials: false
      - name: Pin develop for every job
        id: snapshot
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  check:
    needs: snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.snapshot.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
      - name: Full pre-landing suite, CI helpers, and server build
        env:
          TMPDIR: ${{ runner.temp }}
          FAILURE_JOB: ${{ vars.CI_FAILURE_JOB }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          go install github.com/a-h/templ/cmd/templ@v0.3.1001
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
          npm ci
          node --test scripts/ci/*.test.mjs
          make check
          templ fmt -fail templates/ ui/
          CGO_ENABLED=0 go build -o "$RUNNER_TEMP/server" ./cmd/server
          if [[ "$EVENT_NAME" == schedule && "$FAILURE_JOB" == check ]]; then
            echo 'Deliberate scheduled check failure (CI_FAILURE_JOB=check)'
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: tested-server
          path: ${{ runner.temp }}/server
          if-no-files-found: error
          retention-days: 2

  browser:
    needs: [snapshot, check]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.snapshot.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            scripts/ci/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: tested-server
          path: ${{ runner.temp }}
      - name: Prepare browser checks
        run: |
          npm ci
          make css
          npm ci --prefix scripts/ci
          cd scripts/ci
          npx playwright install --with-deps chromium
      - name: Browser and local HTTP smoke
        env:
          ENV: development
          SITE_URL: http://127.0.0.1:3000
          PORT: '3000'
        run: |
          chmod +x "$RUNNER_TEMP/server"
          "$RUNNER_TEMP/server" > "$RUNNER_TEMP/server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          for attempt in {1..30}; do
            echo "Server readiness attempt $attempt"
            if curl --fail --silent "$SITE_URL/health"; then break; fi
            sleep 1
          done
          make smoke SMOKE_URL="$SITE_URL"
          npm run browser --prefix scripts/ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            ${{ runner.temp }}/browser-results
            ${{ runner.temp }}/server.log
          retention-days: 7

  promote:
    needs: [snapshot, check, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      promoted: ${{ steps.promote.outputs.promoted }}
      head: ${{ steps.promote.outputs.head }}
    steps:
      - name: Require release credentials and native failure intake
        env:
          PROMOTION_TOKEN: ${{ secrets.DETENT_PROMOTION_TOKEN }}
          INTAKE_URL: ${{ secrets.DETENT_CI_INTAKE_URL }}
          INTAKE_TOKEN: ${{ secrets.DETENT_CI_INTAKE_TOKEN }}
        run: |
          [[ -n "$PROMOTION_TOKEN" && "$INTAKE_URL" == https://* && -n "$INTAKE_TOKEN" ]] || {
            echo 'Configure DETENT_PROMOTION_TOKEN and the native Detent CI intake URL/token before enabling release.'
            exit 1
          }
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.snapshot.outputs.sha }}
          fetch-depth: 0
          token: ${{ secrets.DETENT_PROMOTION_TOKEN }}
      - name: Promote only the tested tree
        id: promote
        env:
          TESTED_SHA: ${{ needs.snapshot.outputs.sha }}
        run: bash scripts/ci/promote.sh

  smoke:
    needs: [snapshot, promote]
    if: needs.promote.outputs.promoted == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.snapshot.outputs.sha }}
          persist-credentials: false
      - name: Allow Dokploy to rebuild, then smoke production
        run: |
          sleep 90
          for attempt in {1..15}; do
            echo "Production smoke attempt $attempt"
            if make smoke SMOKE_URL=https://detent.build; then
              {
                echo '### Production smoke passed'
                echo "Tested develop: $TESTED_SHA"
                echo "Promoted main: $PROMOTED_HEAD"
                echo "Run: $RUN_URL"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 30
          done
          exit 1
        env:
          TESTED_SHA: ${{ needs.snapshot.outputs.sha }}
          PROMOTED_HEAD: ${{ needs.promote.outputs.head }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  report:
    needs: [snapshot, check, browser, promote, smoke]
    if: always() && github.ref == 'refs/heads/develop' && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.snapshot.outputs.sha || github.sha }}
          persist-credentials: false
      - uses: actions/github-script@v8
        env:
          INTAKE_URL: ${{ secrets.DETENT_CI_INTAKE_URL }}
          INTAKE_TOKEN: ${{ secrets.DETENT_CI_INTAKE_TOKEN }}
          TESTED_SHA: ${{ needs.snapshot.outputs.sha || github.sha }}
        with:
          script: |
            const { reportFailures } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/ci/report.mjs`);
            await reportFailures({ github, context, env: process.env });
