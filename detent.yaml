schema: 1
# Keep machine-specific config in detent.local.yaml and local agent direction in WORKFLOW.local.md.
tracker:
  kind: github
  github_status_source: label
  repository: digitaldrywood/detent.build
  status_label_prefix: "detent:"
  http_max_idle_conns: 100
  http_max_idle_conns_per_host: 32
  http_idle_conn_timeout_ms: 90000
  github_graphql_warn_remaining: 500
  github_graphql_min_remaining_reserve: 1000
  github_rest_min_remaining_reserve: 1000
  github_rest_fanout_max_requests: 80
  github_rest_debug_logging: false
  auto_provision: true
  active_states:
    - Todo
    - In Progress
    - Rework
    - Merging
  observed_states:
    - Backlog
    - Human Review
    - Blocked
  terminal_states:
    - Done
    - Cancelled
  state_map:
    Cancelled: Done
  priority_map:
    Urgent: 1
    High: 2
    Medium: 3
    Low: 4
    No priority: null
  authorization:
    author_in:
      - corylanou
      - loganlanou
      - jarvislanou
  dependency_auto_unblock:
    enabled: true
    source_states:
      - Blocked
    target_state: Todo
    readiness: terminal_or_merged
  blocked_recovery:
    enabled: false
    source_states:
      - Blocked
    target_state: Rework
    reason_codes:
      - merge_conflict
      - stale_base
      - missing_current_head_ci
  blocker_auto_promote:
    enabled: false
    blocker_states:
      - Backlog
      - Blocked
      - Human Review
    target_state: Todo
polling:
  interval_ms: 60000
  conditional: true
intake:
  sources: []
workspace:
  root: /Users/corylanou/code/detent.build-workspaces
  source_root: /Users/corylanou/projects/digitaldrywood/detent.build
  cache_strategy: isolated
  auto_branch: true
  cleanup_idle_ttl_ms: 86400000
  cleanup_sweep_interval_ms: 600000
deliverable:
  merge_method: squash
agent:
  max_concurrent_agents: 2
  max_turns: 20
  max_session_duration_ms: 7200000
  no_progress_timeout_ms: 5400000
  merge_worker_max_duration_ms: 21600000
  max_retry_backoff_ms: 300000
  overload_retry_delay_ms: 45000
  no_progress_token_limit: 25000000
  no_progress_spend_limit_usd: 3
  resume_orphaned_sessions: true
  # Per-session ceiling on total_tokens. total_tokens counts input + output +
  # cache-created + cache-read tokens, accumulated across every turn of the
  # session, so cached context is re-counted each turn. max_session_context_multiplier
  # is left unset on purpose.
  max_session_tokens: 25000000
  max_session_token_override_label: allow-large-session
  max_concurrent_agents_by_state:
    Merging: 1
  dispatch_priority_by_state:
    - Merging
    - Rework
    - In Progress
    - Todo
  dispatch_priority_by_label: []
  prioritize_unblockers: true
  auto_promote:
    enabled: true
    quiet_seconds: 0
    optout_label: requires-human-review
    allowed_issue_labels: []
    gate_wait_state: source
    gate_wait_timeout_seconds: 3600
    source_state: Human Review
    pass_state: Merging
    rework_state: Rework
    rework_limit: 3
  # Skills guide: https://github.com/digitaldrywood/detent/blob/main/docs/ONBOARDING.md#skills-and-skill-creation
  skills:
    enabled: true
    path: .detent/skills
    max_skills_in_prompt: 50
    creation:
      enabled: true
      max_drafts_per_run: 1
codex:
  # Optional model_reasoning_effort is unset because not every model accepts it.
  # An issue-body ```detent-agent``` block can override effort for that issue.
  command: codex app-server # Provider default: upgrades automatically and avoids retirement breakage.
  approval_policy: never
  thread_sandbox: workspace-write
  turn_sandbox_policy:
    type: workspaceWrite
    networkAccess: true
gate:
  kind: command
  run: make check && CGO_ENABLED=0 go build -o /dev/null ./cmd/server
  require_automated_review: false
  required_status_checks: []
  ci_failure_action: rework
  transient_ci_retry_limit: 2
  validator:
    enabled: false
    # The settings below are inert while enabled is false. Uncomment them
    # together with enabled: true. Leave model empty to inherit the
    # route/provider default; a pin needs manual updates before retirement.
    # model: ""
    # min_score: 0.8
    # max_inline_diff_bytes: 65536
    # block_on:
    #   - p1
plan:
  enabled: false
  review: human
  approval_label: plan-approved
  stop: "Plan Review"
server:
  host: 0.0.0.0
  port: 4000
  kanban:
    mode: integration
budget:
  # billing_mode is subscription and must stay subscription on every project on
  # every host. This fleet authenticates with a flat Codex subscription, so USD
  # figures are notional -- token counts repriced through a compiled table that
  # internal/budget/pricing.go:28 itself calls notional. Enforcing them brakes
  # dispatch over money that was never spent.
  #
  # metered here cost 69 hours of fleet downtime (2026-08-09 through 08-12).
  # Two independent USD brakes fired and neither could clear itself:
  #   - per_issue_max_usd held #15/#16/#18 in In Progress permanently. The
  #     scheduler reported wait_reason budget_cooldown, but a per-issue refusal
  #     is a hard hold with no automatic reset -- refusal_cooldown_seconds is
  #     never consulted on that path (dispatch_planner.go:398, budget.go:192).
  #     #16 spent $9.49 in ONE 13.1M-token session against a $5 cap: the check
  #     is preflight-only against a P90 estimate, so a session can overshoot
  #     and then lock its own issue out forever.
  #   - agent.no_progress_spend_limit_usd (3, above) parked #6 and #17 into
  #     Blocked at 4.8M and 16.8M tokens -- far under the 25M token limit that
  #     was the brake actually meant to catch them.
  #
  # subscription makes every USD path inert: orchestrator/config.go:289 keys
  # subscriptionBilling off billing_mode ALONE and never reads budget.enabled,
  # which is why setting enabled: false is NOT a sufficient fix. The USD caps
  # below stay declared but inert, so re-declaring metered would revive them.
  # The real brake remains agent.no_progress_token_limit (25M).
  billing_mode: subscription
  enabled: true
  per_day_max_usd: 50
  per_issue_max_usd: 5
  refusal_cooldown_seconds: 3600
  pricing_path: priv/pricing/models.yaml
hooks:
  timeout_ms: 60000
