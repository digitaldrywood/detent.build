agent:
    auto_promote:
        enabled: false
    lifetime_session_limit: 60
    lifetime_token_limit: 500000000
    max_retry_backoff_ms: 300000
    max_session_duration_ms: 7200000
    max_session_token_override_label: allow-large-session
    max_session_tokens: 25000000
    max_turns: 20
    merge_worker_max_duration_ms: 21600000
    no_progress_spend_limit_usd: 3
    no_progress_timeout_ms: 5400000
    no_progress_token_limit: 0
    overload_retry_delay_ms: 45000
    prioritize_unblockers: true
    resume_orphaned_sessions: true
    skills:
        creation:
            enabled: true
            max_drafts_per_run: 1
        enabled: true
        max_skills_in_prompt: 50
    stop_run:
        target_state: Human Review
budget:
    billing_mode: subscription
    enabled: true
    per_day_max_usd: 50
    per_issue_max_usd: 5
    refusal_cooldown_seconds: 3600
deliverable:
    merge_method: squash
gate:
    ci_failure_action: rework
    kind: command
    require_automated_review: false
    required_status_checks: []
    run: make check && CGO_ENABLED=0 go build -o /dev/null ./cmd/server
    transient_ci_retry_limit: 2
    validator:
        enabled: false
plan:
    approval_label: plan-approved
    enabled: false
    review: human
    stop: Plan Review
schema: 1
tracker:
    kind: hub_native
    lanes:
        - name: Todo
          role: active
        - name: In Progress
          role: active
        - name: Merging
          role: active
        - name: Blocked
          role: holding
        - name: Human Review
          role: holding
        - name: Done
          role: terminal
